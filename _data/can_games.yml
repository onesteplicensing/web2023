intro_paragraph: >
  By incorporating Can-Am vehicles into the virtual realm, we create an immersive experience that
  captures the attention and interest of players. It becomes a platform for showcasing our capabilities,
  craftsmanship, and commitment to delivering unparalleled excitement. Through the fun and interactive
  nature of video games, we ensure that the Can-Am brand remains at the forefront of enthusiasts' minds.

games:
  - title: "Forza Horizon 5"
    logo: "../assets/images/logo_games.png"
    description: >
      First and foremost, brand exposure lies at the heart of this strategic move. By immersing ourselves in
      the world of video games, we can connect with a younger audience and introduce them to the thrilling Can-Am brand
      from an early age. This exposure lays the foundation for building lasting brand loyalty and establishes a strong
      connection that may translate into future sales of our exceptional vehicles.
      <br><br>
      Diversifying our product offerings is another key motivation behind our entry into the world of video games.
      By expanding beyond the traditional boundaries of automotive manufacturing, we can appeal to a wider range
      of consumers. Through interactive gameplay experiences featuring Can-Am vehicles, we provide a unique and
      captivating way for enthusiasts of all ages to engage with our brand.
    image: "/assets/images/can-am/image.png"

