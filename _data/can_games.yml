header:
  image: "/assets/images/showcase/showcase_02_canam.png"
  title: "video games"
  description: >
    Introducing Can-Am in the World of Video Games.
    <br>
    The Can-Am team has embarked on an exciting new
    venture by entering into the realm of video games with Forza and Dakar Rally.

navigation:
  - title: "Explore Video Games"
    link: "#"
    image: "/assets/images/Group.svg"
    active: true
  - title: "Explore Toys"
