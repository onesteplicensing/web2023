<div class="container my-3 mt-lg-5">
    <div id="carouselExampleFade" class="carousel slide carousel-fade hero" data-bs-ride="carousel">
        <div class="carousel-inner">
            {% for slide in site.data.hero.carousel %}
            <div class="carousel-item {{ slide.id }} {% if slide.active %}active{% endif %}">
                <div class="partial">
                    <h1 class="p-secondary mt-5">
                        <span class="text-black text-uppercase">{{ slide.title }}</span>
                        {{ slide.subtitle }}
                    </h1>
                </div>
                <div class="partial images">
                    <div class="main-bg">
                        {% for img in slide.images %}
                        <img src="{{ img }}" alt="">
                        {% endfor %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">

    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>

</div>
