<div class="container" id="contact">
    <div class="my-5 contact">

        <div class="row position-relative">
            <div class="contact-title my-auto ps-5 col-md-3">
                <h3>{{ site.contact_section.title | markdownify }}</h3>
                <p class="p-primary">{{ site.contact_section.address | markdownify }}</p>
            </div>

            <div class="col-md-9 contact-form">
                <form action="{{ site.contact_section.form_action }}" method="post" class="row g-3" id="contactForm">
                    <div class="col-md-6">
                        <input type="text" name="q4_name" placeholder="Name" required>
                    </div>
                    <div class="col-md-6">
                        <input type="email" name="q5_email" placeholder="Email" required>
                    </div>
                    <div class="col-md-12">
                        <textarea name="q6_message" placeholder="Message" required></textarea>
                    </div>
                    <div class="d-flex align-items-center justify-content-between flex-lg-row flex-column gap-3">
                        <div class="success-mail-submission">
                            {{ site.contact_section.success_message | markdownify }}
                        </div>
                        <button type="submit" class="btn btn-dark px-5 py-2 btn-sm rounded-3 fw-bold">
                            <div class="spinner-border d-none" role="status"></div>
                            {{ site.contact_section.submit_text }}
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>

<script>
    const _url = window.location.href;
    const _contactForm = document.getElementById("contactForm");
    const _spinner = _contactForm.querySelector(".spinner-border");
    const _submitBtn = _contactForm.querySelector('button[type=submit]');
    const hash = window.location.hash;
    _submitBtn.addEventListener('click', () => {
        if (_contactForm.checkValidity())
            _spinner.classList.remove('d-none');
    });

    if (_url.includes('mailSent')) {
        const _success = document.querySelector(".success-mail-submission");
        setTimeout(() => {
            _spinner.classList.add('d-none');
            _contactForm.reset();
            _success.classList.add('show');
            history.replaceState(null, "", window.location.pathname + hash);
        }, 1000);

        setTimeout(() => {
            _success.classList.remove('show')
        }, 8000);
    }
</script>
