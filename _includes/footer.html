<footer class="my-5">
    <div class="container d-flex flex-lg-row justify-content-between align-items-center flex-column-reverse gap-4">
        <div class="icon d-flex gap-2">
            {% for icon in site.social_icons %}
            <a href="{{ icon.url }}" target="_blank">
                <img src="{{ icon.icon }}" alt="{{ icon.name }}">
            </a>
            {% endfor %}
        </div>
        <div class="text-center flex-grow-1 ">
            <p class="p-0 m-0">Copyright &copy;{{ site.time | date: "%Y" }} - OneStep Licensing</p>
        </div>
    </div>
</footer>
