<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Encode+Sans+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" type="image/x-icon" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>


<body class="inner-page">
    <header>
        {% include header.html %}
    </header>

    {{ content }}

    <footer class="mt-5 pt-5">
        {% include footer.html %}
    </footer>

    <script src="{{'/assets/js/bootstrap.bundle.min.js' | relative_url}}" defer></script>
    {% if page.layout == "page" %}
    <script src="{{ '/assets/js/stickyMenu.js' | relative_url }}" defer></script>
     {% endif %}

</body>

</html>
